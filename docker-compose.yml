services:
  so-crates:
    image: ghcr.io/dougburks/so-crates:main
    container_name: so-crates
    ports:
      # Localhost-only by default. To allow other machines on your
      # network to connect, change to "8000:8000".
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./socrates-data
        target: /data
    restart: unless-stopped
